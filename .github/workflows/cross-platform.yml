name: Cross-platform smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Cross-platform smoke
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/cross-platform-smoke.yml@36bea6e4ac643872e9a504b2fe19aad9487e398a # 0.2.0-dev
    with:
      os_list: '["${{ matrix.os }}"]'
      command: python3 -m pip install --user "pytest==9.1.1" && scripts/validate_fast.sh
      windows_command: >-
        python3 -m pip install --user "pytest==9.1.1" &&
        scripts/validate_fast.sh --skip-tests &&
        python3 -m pytest -q
        tests/test_mimocode_config.py
        tests/test_mimocode_memory_boundary.py
        tests/test_mimocode_projection.py
        tests/test_release_assets.py
